<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>แอปพนักงานขับรถ — พากลับ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>body { font-family: 'Prompt', sans-serif; background: #050B14; color: #f1f5f9; }</style>
</head>
<body class="pb-16 relative">

  <!-- ปุ่ม SOS ฉุกเฉิน (ลอยอยู่มุมล่างซ้าย) -->
  <button onclick="alert('🚨 ส่งพิกัด GPS ปัจจุบันให้ตำรวจและแอดมินเรียบร้อยแล้ว!')" class="fixed bottom-4 left-4 z-50 w-14 h-14 bg-rose-600 border-2 border-rose-400 rounded-full flex items-center justify-center shadow-[0_0_20px_rgba(225,29,72,0.5)] active:scale-90 transition">
    <span class="text-white font-black text-xs">SOS</span>
  </button>

  <header class="bg-[#070E1B] border-b border-slate-800 px-4 h-16 flex items-center justify-between z-40 sticky top-0">
    <div class="font-bold text-white text-sm">📋 แผงควบคุมคนขับ (DRV-045)</div>
  </header>

  <main class="p-4 max-w-xl mx-auto space-y-4">
    
    <!-- 1. การรับงาน -->
    <div id="step-accept" class="bg-[#0C1527] border border-amber-500/50 rounded-2xl p-4 shadow-xl text-center space-y-3">
      <div class="text-xs text-amber-400 font-bold animate-pulse">🎯 มีงานจ่ายมาให้คุณ!</div>
      <div class="text-sm font-bold">รับลูกค้า: ทองหล่อ 10 ➡️ ส่ง: อารีย์</div>
      <div class="flex gap-2">
        <button onclick="acceptJob()" class="flex-1 bg-amber-500 text-black font-bold py-3 rounded-xl text-xs">✅ กดรับงานนี้</button>
        <button onclick="alert('ปฏิเสธงานแล้ว แอดมินกำลังหาคนใหม่')" class="px-4 bg-slate-800 text-slate-400 rounded-xl text-xs">❌ ไม่สะดวก</button>
      </div>
    </div>

    <!-- 2. ตรวจรับรถ (ซ่อนไว้ก่อนรับงาน) -->
    <div id="step-inspect" class="hidden space-y-4">
      <div class="bg-[#0C1527] border border-slate-800 rounded-2xl p-4 space-y-3">
        <div class="text-xs font-bold text-amber-400 border-b border-slate-800 pb-2">1. ถ่ายรูปสภาพรถ 4 มุม & เลขไมล์</div>
        <div class="grid grid-cols-2 gap-2 text-xs">
          <label class="flex items-center justify-center h-20 rounded-xl border border-slate-700 bg-[#070D1A]">หน้า<input type="file" accept="image/*" capture class="hidden"/></label>
          <label class="flex items-center justify-center h-20 rounded-xl border border-slate-700 bg-[#070D1A]">หลัง<input type="file" accept="image/*" capture class="hidden"/></label>
          <label class="flex items-center justify-center h-20 rounded-xl border border-slate-700 bg-[#070D1A]">ซ้าย<input type="file" accept="image/*" capture class="hidden"/></label>
          <label class="flex items-center justify-center h-20 rounded-xl border border-slate-700 bg-[#070D1A]">ขวา<input type="file" accept="image/*" capture class="hidden"/></label>
        </div>
        <input type="text" placeholder="ระบุของมีค่าบนรถ..." class="w-full bg-[#070D1A] border border-slate-700 rounded-lg px-3 py-2 text-xs text-white" />
      </div>

      <div class="bg-[#0C1527] border border-slate-800 rounded-2xl p-4 space-y-2">
        <div class="text-xs font-bold text-amber-400">2. ลูกค้าเซ็นรับสภาพรถ</div>
        <canvas id="sig-pad" class="w-full h-24 bg-[#070D1A] border border-slate-700 rounded-xl touch-none"></canvas>
        <button onclick="startTrip()" class="w-full bg-cyan-600 text-white font-bold py-3 rounded-xl text-xs">🚀 ยืนยันผลตรวจ & เริ่มเดินทาง</button>
      </div>
    </div>

    <!-- 3. จบงานและเก็บเงิน (ซ่อนไว้ก่อนเริ่มทาง) -->
    <div id="step-payment" class="hidden bg-[#0C1527] border border-emerald-500/50 rounded-2xl p-4 space-y-3 text-center">
      <div class="text-xs text-emerald-400 font-bold">🏁 ถึงจุดหมายเรียบร้อย</div>
      <div class="text-sm font-black">ยอดเรียกเก็บลูกค้า: 490 บาท</div>
      
      <label class="block flex flex-col items-center justify-center h-32 rounded-xl border-2 border-dashed border-emerald-500/30 bg-[#070D1A] cursor-pointer">
        <input type="file" accept="image/*" class="hidden" onchange="document.getElementById('slip-label').innerText = '✅ อัปโหลดสลิปสำเร็จ'" />
        <span id="slip-label" class="text-emerald-400 text-xs font-bold">📸 ถ่ายรูปสลิปโอนเงิน / กดเงินสด</span>
      </label>

      <button onclick="completeJob()" class="w-full bg-emerald-500 text-slate-950 font-black py-4 rounded-xl text-sm shadow-[0_0_15px_rgba(16,185,129,0.3)]">
        ✅ ปิดจ๊อบงานนี้
      </button>
    </div>

  </main>

  <script>
    function acceptJob() {
      document.getElementById('step-accept').classList.add('hidden');
      document.getElementById('step-inspect').classList.remove('hidden');
      alert("ระบบได้แจ้งลูกค้าแล้วว่าคุณกำลังเดินทางไปจุดรับ");
      
      // Canvas Setup
      const canvas = document.getElementById('sig-pad');
      const ctx = canvas.getContext('2d');
      canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight;
      ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 2;
      let isDrawing = false;
      canvas.addEventListener('touchstart', (e) => { isDrawing = true; ctx.beginPath(); ctx.moveTo(e.touches[0].clientX - canvas.getBoundingClientRect().left, e.touches[0].clientY - canvas.getBoundingClientRect().top); e.preventDefault(); }, {passive:false});
      canvas.addEventListener('touchmove', (e) => { if(isDrawing){ ctx.lineTo(e.touches[0].clientX - canvas.getBoundingClientRect().left, e.touches[0].clientY - canvas.getBoundingClientRect().top); ctx.stroke(); } e.preventDefault(); }, {passive:false});
      canvas.addEventListener('touchend', () => isDrawing = false);
    }

    function startTrip() {
      document.getElementById('step-inspect').classList.add('hidden');
      document.getElementById('step-payment').classList.remove('hidden');
      alert("ส่งข้อมูลเข้ากลุ่ม LINE แจ้งแอดมินเรียบร้อย\nขอให้เดินทางปลอดภัยครับ!");
    }

    function completeJob() {
      alert("✅ จบงานสมบูรณ์แบบ! ข้อมูลสลิปถูกส่งให้บัญชีเรียบร้อย คุณกลับสู่สถานะสแตนด์บาย");
      location.reload();
    }
  </script>
</body>
</html>
