<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Admin Console — พากลับ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>body { font-family: 'Prompt', sans-serif; background: #050B14; color: #f1f5f9; }</style>
</head>
<body class="flex flex-col min-h-screen">

  <!-- ระบบเสียงแจ้งเตือน -->
  <audio id="alert-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

  <!-- 1. Login Modal -->
  <div id="login-modal" class="fixed inset-0 bg-[#050B14] z-50 flex items-center justify-center p-4">
    <div class="bg-[#0C1527] border border-slate-800 rounded-3xl p-6 max-w-sm w-full text-center space-y-4 shadow-2xl">
      <h2 class="text-lg font-bold text-white">ศูนย์บัญชาการแอดมิน</h2>
      <input type="password" id="pin-input" placeholder="PIN (1234)" class="w-full bg-[#070D1A] border border-slate-700 rounded-xl px-4 py-3 text-center text-lg text-white" />
      <button onclick="checkLogin()" class="w-full bg-amber-500 text-slate-950 font-bold py-3 rounded-xl">เข้าสู่ระบบ</button>
    </div>
  </div>

  <header class="bg-[#070E1B] border-b border-slate-800 px-4 h-16 flex items-center justify-between z-20">
    <div class="font-bold text-amber-400">Admin Console ⚡</div>
    <button onclick="location.reload()" class="text-xs bg-slate-800 px-3 py-1 rounded">รีเฟรชข้อมูล</button>
  </header>

  <div class="flex-1 flex flex-col md:flex-row relative">
    <div id="admin-map" class="flex-1 h-[40vh] md:h-full z-10"></div>
    
    <div class="w-full md:w-[450px] bg-[#0A1324] border-l border-slate-800 p-4 overflow-y-auto space-y-4 z-20">
      
      <!-- งานเข้าใหม่ -->
      <div id="pending-jobs-section" class="space-y-3">
        <div class="flex items-center gap-2 text-rose-400 font-bold text-xs"><span class="w-2 h-2 rounded-full bg-rose-500 animate-ping"></span> 🔴 งานเข้าใหม่ (รอจ่ายงาน)</div>
        <div id="pending-jobs-container" class="space-y-3"></div>
      </div>

      <!-- งานกำลังวิ่ง -->
      <div class="text-emerald-400 font-bold text-xs pt-4 border-t border-slate-800">🟢 งานที่กำลังดำเนินการ (Live)</div>
      <div id="active-jobs-container" class="space-y-3"></div>

    </div>
  </div>

  <script>
    const ADMIN_PIN = "1234"; 
    let lastPendingCount = 0;

    function checkLogin() {
      if (document.getElementById('pin-input').value === ADMIN_PIN) {
        document.getElementById('login-modal').classList.add('hidden');
        // เปิดใช้งาน Audio Context ตอนผู้ใช้กดปุ่ม (นโยบายเบราว์เซอร์)
        document.getElementById('alert-sound').play().then(() => {
          document.getElementById('alert-sound').pause(); 
          document.getElementById('alert-sound').currentTime = 0;
        }).catch(e=>{});
        initAdminMap();
      } else alert("รหัสผิด");
    }

    let pendingJobs = [
      { id: "#PK-NEW", type: "ด่วน (Now)", customer: "คุณแพรว", pickup: "ทองหล่อ 10", dropoff: "อารีย์", fare: 490, coords: [13.7340, 100.5820] },
      { id: "#PK-ADV", type: "ล่วงหน้า (23:00 น.)", customer: "คุณธนา", pickup: "RCA", dropoff: "ลาดพร้าว", fare: 590, coords: [13.7505, 100.5752] }
    ];

    let activeJobs = [
      { id: "#PK-206", customer: "คุณนัท", driver: "สมชาย (DRV-082)", status: "IN_TRIP", coords: [13.7510, 100.5735] }
    ];

    let adminMap, markers = {};

    function initAdminMap() {
      adminMap = L.map('admin-map', { zoomControl: false }).setView([13.7563, 100.5638], 12);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(adminMap);
      renderUI();
      setInterval(simulateUpdates, 3000);
    }

    function renderUI() {
      const pendingCon = document.getElementById('pending-jobs-container');
      pendingCon.innerHTML = '';
      
      // แจ้งเตือนเสียงถืองานใหม่เพิ่ม
      if (pendingJobs.length > lastPendingCount) {
        document.getElementById('alert-sound').play().catch(e=>{});
      }
      lastPendingCount = pendingJobs.length;

      pendingJobs.forEach(job => {
        let isAdvance = job.type.includes("ล่วงหน้า");
        let btnDeposit = isAdvance ? `<button onclick="alert('ส่ง QR มัดจำ 200 บาทให้ลูกค้าทาง LINE เรียบร้อย')" class="flex-1 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded text-[10px] font-bold">ส่ง QR มัดจำ</button>` : '';

        pendingCon.innerHTML += `
          <div class="bg-rose-500/10 border border-rose-500/50 rounded-xl p-3 space-y-2">
            <div class="flex justify-between items-center text-sm font-black text-white">
              <span>${job.customer}</span> <span class="text-[10px] text-amber-300 bg-amber-900/50 px-2 py-0.5 rounded">${job.type}</span>
            </div>
            <div class="text-[11px] text-slate-300">รับ: ${job.pickup} ➡️ ส่ง: ${job.dropoff}</div>
            
            <div class="flex gap-2 pt-2">
              <button onclick="dispatchJob('${job.id}')" class="flex-1 py-1.5 bg-amber-500 text-black rounded text-[10px] font-bold">🎯 จ่ายงาน</button>
              ${btnDeposit}
              <button onclick="cancelJob('${job.id}')" class="px-3 py-1.5 bg-slate-800 text-rose-400 border border-rose-500/30 rounded text-[10px] font-bold">ยกเลิก</button>
            </div>
          </div>
        `;
        if(!markers[job.id]) {
           let icon = L.divIcon({ html: `<div style="background:#f43f5e; width:16px; height:16px; border-radius:50%; border:2px solid #fff;"></div>`, iconSize:[16,16] });
           markers[job.id] = L.marker(job.coords, {icon: icon}).addTo(adminMap);
        }
      });

      const activeCon = document.getElementById('active-jobs-container');
      activeCon.innerHTML = '';
      activeJobs.forEach(job => {
        activeCon.innerHTML += `
          <div class="bg-[#070D1A] border border-cyan-500/30 rounded-xl p-3 space-y-2">
            <div class="text-sm font-black text-white">${job.customer} <span class="text-xs font-normal text-slate-400">ดูแลโดย ${job.driver}</span></div>
            <div class="flex gap-2">
              <button class="flex-1 py-1 bg-slate-800 text-slate-200 rounded text-[10px]">📞 โทรลูกค้า</button>
              <button onclick="cancelJob('${job.id}')" class="px-3 py-1 bg-slate-800 text-rose-400 rounded text-[10px]">ลูกค้ายกเลิกงาน (ปรับ 200)</button>
            </div>
          </div>
        `;
        if(!markers[job.id]) {
           let icon = L.divIcon({ html: `<div style="background:#06b6d4; width:16px; height:16px; border-radius:50%; border:2px solid #fff;"></div>`, iconSize:[16,16] });
           markers[job.id] = L.marker(job.coords, {icon: icon}).addTo(adminMap);
        } else markers[job.id].setLatLng(job.coords);
      });
    }

    function cancelJob(id) {
      if(confirm('ต้องการยกเลิกงานนี้ และบันทึกประวัติการปรับเงินหรือไม่?')) {
        pendingJobs = pendingJobs.filter(j => j.id !== id);
        activeJobs = activeJobs.filter(j => j.id !== id);
        if(markers[id]) { adminMap.removeLayer(markers[id]); delete markers[id]; }
        renderUI();
      }
    }

    function dispatchJob(id) {
      alert("จำลอง: จ่ายงานให้คนขับเรียบร้อย");
      let job = pendingJobs.find(j => j.id === id);
      pendingJobs = pendingJobs.filter(j => j.id !== id);
      activeJobs.push({ id: job.id, customer: job.customer, driver: "คนขับว่าง (DRV-TEST)", status: "HEADING", coords: job.coords });
      renderUI();
    }

    function simulateUpdates() {
      activeJobs.forEach(j => { j.coords[0]+=0.001; j.coords[1]+=0.001; });
      renderUI();
    }
  </script>
</body>
</html>
